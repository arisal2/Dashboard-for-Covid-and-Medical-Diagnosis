# PostgreSQL configuration for Rails 7.1
# Documentation: https://guides.rubyonrails.org/configuring.html#configuring-a-database

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('DATABASE_HOST', 'db') %>
  username: <%= ENV.fetch('DATABASE_USERNAME', 'postgres') %>
  password: <%= ENV.fetch('DATABASE_PASSWORD', 'password') %>
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  timeout: 5000

development:
  <<: *default
  database: fluffy_octo_system_development

test:
  <<: *default
  database: fluffy_octo_system_test

production:
  <<: *default
  database: fluffy_octo_system_production
  username: <%= ENV.fetch('DATABASE_USERNAME', 'fluffy_octo_system') %>
  password: <%= ENV['DATABASE_PASSWORD'] %>
  host: <%= ENV.fetch('DATABASE_HOST', 'localhost') %>
  # Use connection pooling for production
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 10) %>
